<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4 shadow" style="max-width: 500px; width: 100%;">
    <h2 class="text-center mb-4">Add New Expense</h2>

    <form (ngSubmit)="addExpense()">
      <div class="form-group mb-3">
        <label class="form-label" for="amount">Amount ($)</label>
        <input
          id="amount"
          type="number"
          [(ngModel)]="expense.amount"
          name="amount"
          placeholder="Enter amount"
          class="form-control"
          min="0.01"
          step="0.01"
          required
        />
        <small *ngIf="expense.amount != null && expense.amount <= 0" class="text-danger">
          Amount must be greater than $0.00.
        </small>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="date">Date</label>
        <input
          id="date"
          type="date"
          [(ngModel)]="expense.date"
          name="date"
          class="form-control"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="account">Account</label>
        <select
          id="account"
          class="form-select"
          [(ngModel)]="expense.accountId"
          name="accountId"
          [disabled]="accountsLoading || accounts.length === 0"
          required
        >
          <option [ngValue]="null" disabled>Select account</option>
          <option *ngFor="let account of accounts" [ngValue]="account.id">
            {{ account.name }}
          </option>
        </select>
        <small *ngIf="accountsLoading" class="text-muted">Loading accounts...</small>
        <small *ngIf="accountLoadError" class="text-danger d-block">
          {{ accountLoadError }}
        </small>
        <small
          *ngIf="!accountsLoading && !accountLoadError && accounts.length === 0"
          class="text-danger d-block"
        >
          No active accounts available.
        </small>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="category">Category</label>
        <select
          id="category"
          class="form-select"
          [(ngModel)]="expense.category"
          name="category"
          required
        >
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="description">Description</label>
        <input
          id="description"
          type="text"
          [(ngModel)]="expense.description"
          name="description"
          placeholder="Enter description"
          class="form-control"
        />
      </div>

      <div class="mb-4 form-check">
        <input
          id="isRefund"
          type="checkbox"
          class="form-check-input"
          [(ngModel)]="expense.isRefund"
          name="isRefund"
        />
        <label class="form-check-label" for="isRefund">Refund or credit</label>
      </div>

      <div *ngIf="validationMessage" class="alert alert-danger py-2" role="alert">
        {{ validationMessage }}
      </div>

      <div class="d-grid gap-2">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="goToDashboard()"
          [disabled]="isSubmitting"
        >
          Cancel / Back to Dashboard
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaveDisabled">
          {{ isSubmitting ? 'Saving...' : 'Save Expense' }}
        </button>
      </div>
    </form>
  </div>
</div>
